version: '3.8'

services:
  booking-db:
    image: postgres:17-alpine
    container_name: booking-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  booking-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-backend
    ports:
      - "8080:8080"
    depends_on:
      booking-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: booking-db
      DB_PORT: 5432
      DB_NAME: booking_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    restart: on-failure

volumes:
  pgdata:
    driver: local
